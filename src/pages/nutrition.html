<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search nutrition information using Open Food Facts." />

    <title>Nutrition Search | Personal Fitness Tracker</title>

    <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body>

    <header>
        <div class="logo">FitTrack</div>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/#exercises">Exercises</a></li>
                <li><a href="/#workouts">Workouts</a></li>
                <li><a href="/src/pages/nutrition.html">Nutrition</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="section nutrition-page">

            <h1>Nutrition Search</h1>

            <p class="nutrition-description">
                Enter a product barcode to view nutrition information
                from Open Food Facts.
            </p>

            <div class="nutrition-search">

                <label for="barcodeInput">
                    Product Barcode
                </label>

                <input type="text" id="barcodeInput" placeholder="Example: 3017624010701" />

                <button type="button" id="searchFoodButton" class="button">
                    Search Product
                </button>

            </div>

            <div id="foodResult" class="food-result" aria-live="polite"></div>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Personal Fitness Tracker |
            WDD 330 Final Project
        </p>
    </footer>

    <script type="module" src="/src/js/main.js"></script>

</body>

</html>
